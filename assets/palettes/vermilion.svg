<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-labelledby="title description">
  <title id="title">Vermilion palette</title>
  <desc id="description">Vermilion, dark palette. Base #1C1919, Surface #231E1D, Ink #E9DEDA, Muted #A08E89, Accent #B65B4A, Deep #7D1F23.</desc>
  <foreignObject x="0" y="0" width="400" height="212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        .card { width: 400px; height: 212px; padding: 24px; border: 1px solid #40302D; border-radius: 4px; background: #1C1919; color: #E9DEDA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .eyebrow { color: #A08E89; font-size: 10px; line-height: 12px; letter-spacing: 1.8px; text-transform: uppercase; }
        h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.5px; }
        .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
        .color { height: 50px; border-radius: 2px; border: 1px solid #40302D; }
        .label { margin-top: 8px; font-size: 10px; line-height: 12px; }
        .hex { margin-top: 3px; color: #A08E89; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 12px; }
      </style>
      <div class="card">
        <div class="eyebrow">04 / dark</div>
        <h2>Vermilion</h2>
        <div class="swatches">
          <div class="swatch"><div class="color" style="background: #1C1919"></div><div class="label">Base</div><div class="hex">#1C1919</div></div>
          <div class="swatch"><div class="color" style="background: #231E1D"></div><div class="label">Surface</div><div class="hex">#231E1D</div></div>
          <div class="swatch"><div class="color" style="background: #E9DEDA"></div><div class="label">Ink</div><div class="hex">#E9DEDA</div></div>
          <div class="swatch"><div class="color" style="background: #A08E89"></div><div class="label">Muted</div><div class="hex">#A08E89</div></div>
          <div class="swatch"><div class="color" style="background: #B65B4A"></div><div class="label">Accent</div><div class="hex">#B65B4A</div></div>
          <div class="swatch"><div class="color" style="background: #7D1F23"></div><div class="label">Deep</div><div class="hex">#7D1F23</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
