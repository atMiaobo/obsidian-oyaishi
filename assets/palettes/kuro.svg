<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-labelledby="title description">
  <title id="title">Kuro / Turquoise palette</title>
  <desc id="description">Kuro / Turquoise, dark palette. Base #0D1112, Surface #141A1B, Ink #D9E8E6, Muted #8FA3A2, Accent #4CB7B0, Deep #2E8F8A.</desc>
  <foreignObject x="0" y="0" width="400" height="212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        .card { width: 400px; height: 212px; padding: 24px; border: 1px solid #263233; border-radius: 4px; background: #0E1112; color: #D9E8E6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .eyebrow { color: #8FA3A2; font-size: 10px; line-height: 12px; letter-spacing: 1.8px; text-transform: uppercase; }
        h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.5px; }
        .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
        .color { height: 50px; border-radius: 2px; border: 1px solid #263233; }
        .label { margin-top: 8px; font-size: 10px; line-height: 12px; }
        .hex { margin-top: 3px; color: #8FA3A2; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 12px; }
      </style>
      <div class="card">
        <div class="eyebrow">06 / dark</div>
        <h2>Kuro / Turquoise</h2>
        <div class="swatches">
          <div class="swatch"><div class="color" style="background: #0D1112"></div><div class="label">Base</div><div class="hex">#0D1112</div></div>
          <div class="swatch"><div class="color" style="background: #141A1B"></div><div class="label">Surface</div><div class="hex">#141A1B</div></div>
          <div class="swatch"><div class="color" style="background: #D9E8E6"></div><div class="label">Ink</div><div class="hex">#D9E8E6</div></div>
          <div class="swatch"><div class="color" style="background: #8FA3A2"></div><div class="label">Muted</div><div class="hex">#8FA3A2</div></div>
          <div class="swatch"><div class="color" style="background: #4CB7B0"></div><div class="label">Accent</div><div class="hex">#4CB7B0</div></div>
          <div class="swatch"><div class="color" style="background: #2E8F8A"></div><div class="label">Deep</div><div class="hex">#2E8F8A</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
