<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-labelledby="title description">
  <title id="title">Obsidian Violet palette</title>
  <desc id="description">Obsidian Violet, dark palette. Base #1A1B1F, Surface #22232A, Ink #E2DDE8, Muted #A29AAF, Accent #71627A, Deep #2E293A.</desc>
  <foreignObject x="0" y="0" width="400" height="212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        .card { width: 400px; height: 212px; padding: 24px; border: 1px solid #3D354B; border-radius: 4px; background: #1B1C1F; color: #E2DDE8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .eyebrow { color: #A29AAF; font-size: 10px; line-height: 12px; letter-spacing: 1.8px; text-transform: uppercase; }
        h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.5px; }
        .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
        .color { height: 50px; border-radius: 2px; border: 1px solid #3D354B; }
        .label { margin-top: 8px; font-size: 10px; line-height: 12px; }
        .hex { margin-top: 3px; color: #A29AAF; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 12px; }
      </style>
      <div class="card">
        <div class="eyebrow">05 / dark</div>
        <h2>Obsidian Violet</h2>
        <div class="swatches">
          <div class="swatch"><div class="color" style="background: #1A1B1F"></div><div class="label">Base</div><div class="hex">#1A1B1F</div></div>
          <div class="swatch"><div class="color" style="background: #22232A"></div><div class="label">Surface</div><div class="hex">#22232A</div></div>
          <div class="swatch"><div class="color" style="background: #E2DDE8"></div><div class="label">Ink</div><div class="hex">#E2DDE8</div></div>
          <div class="swatch"><div class="color" style="background: #A29AAF"></div><div class="label">Muted</div><div class="hex">#A29AAF</div></div>
          <div class="swatch"><div class="color" style="background: #71627A"></div><div class="label">Accent</div><div class="hex">#71627A</div></div>
          <div class="swatch"><div class="color" style="background: #2E293A"></div><div class="label">Deep</div><div class="hex">#2E293A</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
