<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-labelledby="title description">
  <title id="title">Sumi Negative palette</title>
  <desc id="description">Sumi Negative, dark palette. Base #131212, Surface #191717, Ink #E3CFC8, Muted #A99B98, Accent #D4ADA3, Deep #A78279.</desc>
  <foreignObject x="0" y="0" width="400" height="212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        .card { width: 400px; height: 212px; padding: 24px; border: 1px solid #373131; border-radius: 4px; background: #131212; color: #E3CFC8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .eyebrow { color: #A99B98; font-size: 10px; line-height: 12px; letter-spacing: 1.8px; text-transform: uppercase; }
        h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.5px; }
        .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
        .color { height: 50px; border-radius: 2px; border: 1px solid #373131; }
        .label { margin-top: 8px; font-size: 10px; line-height: 12px; }
        .hex { margin-top: 3px; color: #A99B98; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 12px; }
      </style>
      <div class="card">
        <div class="eyebrow">07 / dark</div>
        <h2>Sumi Negative</h2>
        <div class="swatches">
          <div class="swatch"><div class="color" style="background: #131212"></div><div class="label">Base</div><div class="hex">#131212</div></div>
          <div class="swatch"><div class="color" style="background: #191717"></div><div class="label">Surface</div><div class="hex">#191717</div></div>
          <div class="swatch"><div class="color" style="background: #E3CFC8"></div><div class="label">Ink</div><div class="hex">#E3CFC8</div></div>
          <div class="swatch"><div class="color" style="background: #A99B98"></div><div class="label">Muted</div><div class="hex">#A99B98</div></div>
          <div class="swatch"><div class="color" style="background: #D4ADA3"></div><div class="label">Accent</div><div class="hex">#D4ADA3</div></div>
          <div class="swatch"><div class="color" style="background: #A78279"></div><div class="label">Deep</div><div class="hex">#A78279</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
