<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-labelledby="title description">
  <title id="title">Kohaku palette</title>
  <desc id="description">Kohaku, dark palette. Base #24211E, Surface #332D27, Ink #E4D7C2, Muted #B7A48B, Accent #B4946C, Deep #7D6040.</desc>
  <foreignObject x="0" y="0" width="400" height="212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        .card { width: 400px; height: 212px; padding: 24px; border: 1px solid #655B4F; border-radius: 4px; background: #23211F; color: #E4D7C2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .eyebrow { color: #B7A48B; font-size: 10px; line-height: 12px; letter-spacing: 1.8px; text-transform: uppercase; }
        h2 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.5px; }
        .swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
        .color { height: 50px; border-radius: 2px; border: 1px solid #655B4F; }
        .label { margin-top: 8px; font-size: 10px; line-height: 12px; }
        .hex { margin-top: 3px; color: #B7A48B; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 12px; }
      </style>
      <div class="card">
        <div class="eyebrow">03 / dark</div>
        <h2>Kohaku</h2>
        <div class="swatches">
          <div class="swatch"><div class="color" style="background: #24211E"></div><div class="label">Base</div><div class="hex">#24211E</div></div>
          <div class="swatch"><div class="color" style="background: #332D27"></div><div class="label">Surface</div><div class="hex">#332D27</div></div>
          <div class="swatch"><div class="color" style="background: #E4D7C2"></div><div class="label">Ink</div><div class="hex">#E4D7C2</div></div>
          <div class="swatch"><div class="color" style="background: #B7A48B"></div><div class="label">Muted</div><div class="hex">#B7A48B</div></div>
          <div class="swatch"><div class="color" style="background: #B4946C"></div><div class="label">Accent</div><div class="hex">#B4946C</div></div>
          <div class="swatch"><div class="color" style="background: #7D6040"></div><div class="label">Deep</div><div class="hex">#7D6040</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
